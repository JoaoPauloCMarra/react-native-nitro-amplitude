name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate against package.json
        required: true
      npm_dist_tag:
        description: npm dist-tag to publish with
        required: false
        default: latest

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24"
  PACKAGE_DIR: packages/react-native-nitro-amplitude

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CC: clang
      CXX: clang++
      DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_dist_tag || github.event.release.prerelease && 'next' || 'latest' }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install C++ coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - run: bun install --frozen-lockfile

      - name: Validate release tag
        run: |
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          expected_tag="v${version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${expected_tag}"
            exit 1
          fi

      - name: Check npm version availability
        run: |
          package_name="$(node -p "require('./${PACKAGE_DIR}/package.json').name")"
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${package_name}@${version} is already published"
            exit 1
          fi

      - name: Release preflight
        run: bun run release:preflight

      - name: Publish to npm
        run: |
          args=(--yes --with-coverage --tag="${DIST_TAG}")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--dry-run)
          fi
          bun run publish-package -- "${args[@]}"

  verify:
    name: Verify published package
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event_name == 'release' }}

    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify public registry metadata
        run: |
          package_name="react-native-nitro-amplitude"
          version="$(node -p "require('./packages/react-native-nitro-amplitude/package.json').version")"
          expected_tag="v${version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${expected_tag}"
            exit 1
          fi
          published_version="$(npm view "${package_name}@${version}" version 2>/dev/null || true)"
          if [ -z "${published_version}" ] || [ "${published_version}" != "${version}" ]; then
            echo "::error::Published version ${published_version} does not match ${version}"
            exit 1
          fi
          dist_tag="${{ github.event.release.prerelease && 'next' || 'latest' }}"
          dist_value="$(npm view "${package_name}" dist-tags.${dist_tag} 2>/dev/null || true)"
          if [ -z "${dist_value}" ] || [ "${dist_value}" != "${version}" ]; then
            echo "::error::dist-tag ${dist_tag} is ${dist_value}, expected ${version}"
            exit 1
          fi
          git_head="$(npm view "${package_name}@${version}" gitHead 2>/dev/null || true)"
          expected_head="$(git rev-parse HEAD)"
          if [ -z "${git_head}" ]; then
            echo "::warning::npm did not expose gitHead; commit provenance cannot be verified"
          elif [ "${git_head}" != "${expected_head}" ]; then
            echo "::error::gitHead ${git_head} does not match release commit ${expected_head}"
            exit 1
          fi
          echo "Verified ${package_name}@${version} on dist-tag ${dist_tag}"
