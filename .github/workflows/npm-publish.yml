name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate against package.json
        required: true
      npm_dist_tag:
        description: npm dist-tag to publish with
        required: false
        default: latest
      dry_run:
        description: Run publish validation without publishing
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write

env:
  BUN_VERSION: "1.3.11"
  NODE_VERSION: "24"
  PACKAGE_DIR: packages/react-native-nitro-amplitude

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    env:
      DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_dist_tag || github.event.release.prerelease && 'next' || 'latest' }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install C++ coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      - run: bun install --frozen-lockfile

      - name: Validate release tag
        run: |
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          expected_tag="v${version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${expected_tag}"
            exit 1
          fi

      - name: Check npm version availability
        if: github.event_name == 'release' || inputs.dry_run == 'false'
        run: |
          package_name="$(node -p "require('./${PACKAGE_DIR}/package.json').name")"
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${package_name}@${version} is already published"
            exit 1
          fi

      - name: Release preflight
        run: bun run release:preflight

      - name: Publish to npm
        run: |
          args=(--yes --with-coverage --tag="${DIST_TAG}")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            args+=(--dry-run)
          fi
          bun run publish-package -- "${args[@]}"
