appId: com.nitroamplitude.example
name: "Nitro Amplitude Smoke"
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Smoke Test"
    timeout: 120000
- tapOn: "Run All"
- extendedWaitUntil:
    visible: "0 failed"
    timeout: 30000
- extendedWaitUntil:
    visible: "passed"
    timeout: 30000
- assertNotVisible: "FAILED"
- scrollUntilVisible:
    element:
      text: "Track Event"
    direction: DOWN
    timeout: 30000
- tapOn: "Track Event"
- extendedWaitUntil:
    visible: "Tracked nitro_amplitude_demo"
    timeout: 30000
- tapOn: "Flush"
- extendedWaitUntil:
    visible: "Flush complete"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Fetch"
    direction: DOWN
    timeout: 30000
- tapOn: "Fetch"
- extendedWaitUntil:
    visible: "Fetched demo-flag: on"
    timeout: 30000
- tapOn: "Read Variant"
- extendedWaitUntil:
    visible: "Read demo-flag: on"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "variant-value"
    direction: DOWN
    timeout: 30000
