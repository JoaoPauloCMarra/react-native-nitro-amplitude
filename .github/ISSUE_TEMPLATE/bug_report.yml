name: Bug report
description: Report a reproducible Nitro Amplitude bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or repository that reproduces the issue.
      render: tsx
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Analytics API
        - Experiment API
        - Native storage
        - Native context
        - Native HTTP transport
        - Expo config plugin
        - Packaging/build
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: react-native-nitro-amplitude, react-native, react-native-nitro-modules, Expo if used.
      placeholder: "react-native-nitro-amplitude 0.1.0, RN 0.85.3, Nitro 0.35.7"
    validations:
      required: true
