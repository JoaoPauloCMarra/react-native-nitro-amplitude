name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  BUN_VERSION: "1.3.14"

jobs:
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Verify core versions
        run: bun run verify:core-versions

      - name: Verify RN 0.87 strict TypeScript compatibility
        run: bun run typecheck:rn087

      - name: Verify generated Nitro bindings
        run: bun run codegen:check

      - name: Lint
        run: bun run lint:check

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck package
        run: bun run typecheck

      - name: Test public types
        run: bun run test:types

      - name: Check example app
        run: bun run example:check

      - name: Unit tests with coverage
        run: bun run test:coverage -- --runInBand --watchman=false

      - name: C++ tests with coverage
        run: bun run test:cpp:coverage

      - name: Test lifecycle and release contracts
        run: bun run test:lifecycle

      - name: Build package artifacts
        run: bun run build

      - name: Audit package contents
        run: bun run audit:package

      - name: Validate auth-free publication
        run: bun run publish-package:dry-run

      - name: C++ sanitizer tests
        run: bun run test:cpp:sanitize

      - name: C++ thread sanitizer tests
        run: bun run test:cpp:tsan

  portable-cpp:
    name: Linux C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - run: bun install --frozen-lockfile
      - run: bun run test:cpp

  linux-preflight:
    name: Linux release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - run: bun install --frozen-lockfile
      - name: CI gate on Linux (the publish workflow runs it here)
        env:
          CC: clang
          CXX: clang++
        run: bun run check:ci

  example-android:
    name: Example app (Android build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Free disk space and select JDK 17
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          df -h /
      - run: bun install --frozen-lockfile
      - name: Generate the Android project
        run: CI=1 bun run --cwd apps/example prebuild -- --platform android
      - name: Build the Android example (debug, arm64-v8a)
        run: bun run example:android:assemble

  example-ios:
    name: Example app (iOS build)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generate the iOS project
        run: CI=1 bun run --cwd apps/example prebuild -- --platform ios
      - name: Build the iOS example (Debug, simulator)
        run: bun run example:ios:build
