appId: com.nitroamplitude.example
name: "Nitro Amplitude Smoke"
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Smoke Test"
    timeout: 120000
- tapOn: "Run All"
- extendedWaitUntil:
    visible:
      id: "smoke-summary"
      text: ".*0 failed.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "smoke-summary"
      text: ".*passed.*"
    timeout: 30000
- assertNotVisible: "FAILED"
- scrollUntilVisible:
    element:
      id: "track-event"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "track-event"
- scrollUntilVisible:
    element:
      id: "analytics-result"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "analytics-result"
      text: "Tracked nitro_amplitude_demo.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "identify-user"
    direction: UP
    timeout: 30000
- tapOn:
    id: "identify-user"
- scrollUntilVisible:
    element:
      id: "analytics-result"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "analytics-result"
      text: "Identified demo-user.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "read-diagnostics"
    direction: UP
    timeout: 30000
- tapOn:
    id: "read-diagnostics"
- scrollUntilVisible:
    element:
      id: "analytics-result"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "analytics-result"
      text: "queue=.*initialized=.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "flush-events"
    direction: UP
    timeout: 30000
- tapOn:
    id: "flush-events"
- scrollUntilVisible:
    element:
      id: "analytics-result"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "analytics-result"
      text: "Flush ok.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "fetch-variants"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "fetch-variants"
- scrollUntilVisible:
    element:
      id: "experiment-result"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "experiment-result"
      text: "Fetched 1 key\\(s\\).*"
    timeout: 30000
- tapOn:
    id: "read-variant"
- scrollUntilVisible:
    element:
      id: "experiment-result"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "experiment-result"
      text: "Read demo-flag: on.*"
    timeout: 30000
- tapOn:
    id: "send-exposure"
- scrollUntilVisible:
    element:
      id: "experiment-result"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "experiment-result"
      text: "Exposure queued for demo-flag.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "variant-value"
    direction: DOWN
    timeout: 30000
